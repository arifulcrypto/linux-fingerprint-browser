name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redaction:
    name: Redaction check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify no secrets or real addresses
        run: ./scripts/check-redaction.sh

  links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify relative links
        run: ./scripts/check-links.sh

  shell:
    name: Shell syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: bash -n on scripts
        run: |
          for f in scripts/*.sh configs/chrome/*.sh; do
            bash -n "$f"
          done
